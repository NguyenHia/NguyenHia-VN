<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng Nhập — NguyenHia VN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --p:#FF6B35;--pd:#E55525;
  --bg:#F2F3F7;--surf:#FFFFFF;--surf2:#F7F8FC;
  --txt:#111827;--txt2:#6B7280;--txt3:#9CA3AF;
  --border:#E5E7EB;--r:16px;
  --trans:all .25s cubic-bezier(.4,0,.2,1);
}
[data-theme=dark]{
  --bg:#0D0D14;--surf:#161622;--surf2:#1E1E2E;
  --txt:#F9FAFB;--txt2:#9CA3AF;--txt3:#6B7280;--border:#2A2A3E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;transition:background .35s,color .35s}
.page-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px}
.back-btn{
  position:fixed;top:16px;left:16px;
  width:40px;height:40px;border-radius:50%;
  background:var(--surf);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--txt2);font-size:16px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.08);transition:var(--trans);
  text-decoration:none;
}
.back-btn:hover{background:var(--p);color:#fff;border-color:var(--p)}
.logo-area{text-align:center;margin-bottom:28px}
.logo-circle{
  width:70px;height:70px;border-radius:20px;
  background:linear-gradient(135deg,#FF6B35,#FF9558);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:26px;color:#fff;margin:0 auto 14px;
  box-shadow:0 8px 24px rgba(255,107,53,.35);
}
.logo-title{font-size:24px;font-weight:900;color:var(--txt)}
.logo-sub{font-size:14px;color:var(--txt2);margin-top:4px}
.card{background:var(--surf);border-radius:var(--r);border:1px solid var(--border);padding:24px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.form-title{font-size:22px;font-weight:900;margin-bottom:5px}
.form-sub{font-size:13.5px;color:var(--txt2);margin-bottom:22px}
.fg{margin-bottom:16px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--txt);margin-bottom:6px}
.iw{position:relative}
.fi{
  width:100%;padding:13px 44px;
  background:var(--surf2);border:2px solid var(--border);
  border-radius:12px;font-size:15px;color:var(--txt);
  outline:none;transition:var(--trans);font-family:inherit;
}
.fi:focus{border-color:var(--p);background:var(--surf);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
.fi.err{border-color:#EF4444}
.fi::placeholder{color:var(--txt3)}
.il{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:14px;pointer-events:none}
.fi:focus~.il{color:var(--p)}
.ir{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:14px;cursor:pointer;transition:var(--trans)}
.ir:hover{color:var(--p)}
.em{font-size:12px;color:#EF4444;margin-top:5px;display:none}
.em.show{display:block}
.btn-main{
  width:100%;padding:14px;border-radius:13px;
  background:var(--p);color:#fff;
  font-size:16px;font-weight:800;
  cursor:pointer;border:none;font-family:inherit;
  transition:var(--trans);margin-top:4px;
}
.btn-main:hover{background:var(--pd);transform:translateY(-1px)}
.btn-main:active{transform:scale(.97)}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-size:12px;color:var(--txt3);font-weight:600}
.btn-out{
  width:100%;padding:12px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--surf2);
  color:var(--txt2);font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:var(--trans);
}
.btn-out:hover{border-color:var(--p);color:var(--p);background:rgba(255,107,53,.06)}
.form-footer{text-align:center;margin-top:18px;font-size:14px;color:var(--txt2)}
.form-footer a{color:var(--p);font-weight:700;cursor:pointer;text-decoration:none}
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-30px);
  background:var(--surf);color:var(--txt);padding:12px 20px;border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:900;
  font-size:13.5px;font-weight:600;max-width:90vw;text-align:center;
  opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);
  border-left:4px solid var(--p);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-left-color:#22C55E}
.toast.error{border-left-color:#EF4444}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<a href="index.html" class="back-btn"><i class="fa fa-arrow-left"></i></a>

<div class="page-wrap">
  <div class="logo-area">
    <div class="logo-circle">NH</div>
    <div class="logo-title">NguyenHia VN</div>
    <div class="logo-sub">Đăng nhập để tiếp tục</div>
  </div>

  <div class="card">
    <div class="form-title">Đăng Nhập</div>
    <div class="form-sub">Chào mừng trở lại! Nhập thông tin của bạn.</div>

    <div class="fg">
      <label class="fl" for="lEmail">Email</label>
      <div class="iw">
        <input type="email" class="fi" id="lEmail" placeholder="example@gmail.com" autocomplete="email">
        <i class="fa fa-envelope il"></i>
      </div>
      <div class="em" id="eEmail"></div>
    </div>

    <div class="fg">
      <label class="fl" for="lPass">Mật Khẩu</label>
      <div class="iw">
        <input type="password" class="fi" id="lPass" placeholder="••••••••" autocomplete="current-password">
        <i class="fa fa-lock il"></i>
        <i class="fa fa-eye ir" id="eyePass" onclick="toggleEye('lPass','eyePass')"></i>
      </div>
      <div class="em" id="ePass"></div>
    </div>

    <button class="btn-main" id="btnLogin" onclick="handleLogin()">
      <i class="fa fa-sign-in-alt"></i> Đăng Nhập
    </button>

    <div class="divider"><span>hoặc</span></div>

    <button class="btn-out" onclick="window.location.href='register.html'">
      <i class="fa fa-user-plus"></i> Chưa có tài khoản? Đăng Ký Ngay
    </button>

    <div class="form-footer">
      <a href="index.html">← Về Trang Chủ</a>
    </div>
  </div>
</div>

<script>
// Theme
const theme=localStorage.getItem('nhvn_theme')||'system';
if(theme==='dark')document.body.setAttribute('data-theme','dark');
else if(theme==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches)document.body.setAttribute('data-theme','dark');

function toggleEye(i,e){
  const inp=document.getElementById(i),ico=document.getElementById(e);
  inp.type=inp.type==='password'?'text':'password';
  ico.className=inp.type==='text'?'fa fa-eye-slash ir':'fa fa-eye ir';
}

function showErr(fId,eId,msg){
  document.getElementById(fId).classList.add('err');
  const e=document.getElementById(eId);e.textContent=msg;e.classList.add('show');
}
function clearErr(fId,eId){
  document.getElementById(fId).classList.remove('err');
  document.getElementById(eId).classList.remove('show');
}

let toastT=null;
function showToast(msg,type='info',dur=3000){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast ${type} show`;
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),dur);
}

function handleLogin(){
  clearErr('lEmail','eEmail');clearErr('lPass','ePass');
  const email=document.getElementById('lEmail').value.trim();
  const pass=document.getElementById('lPass').value;
  let ok=true;

  if(!email){showErr('lEmail','eEmail','Vui lòng nhập email');ok=false;}
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('lEmail','eEmail','Email không hợp lệ');ok=false;}
  if(!pass){showErr('lPass','ePass','Vui lòng nhập mật khẩu');ok=false;}
  if(!ok)return;

  const users=JSON.parse(localStorage.getItem('nhvn_users')||'[]');
  const user=users.find(u=>u.email.toLowerCase()===email.toLowerCase());

  if(!user){
    showErr('lEmail','eEmail','Email chưa đăng ký. Vui lòng đăng ký trước!');
    return;
  }
  if(user.password!==pass){
    showErr('lPass','ePass','Mật khẩu không đúng');
    return;
  }

  // Success
  const session={name:user.name,email:user.email,verified:true};
  localStorage.setItem('nhvn_session',JSON.stringify(session));
  showToast('🎉 Đăng nhập thành công! Chào '+user.name,'success');
  setTimeout(()=>window.location.href='index.html',1200);
}

document.getElementById('lPass').addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
document.getElementById('lEmail').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lPass').focus()});
</script>
</body>
</html>
